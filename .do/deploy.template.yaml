spec:
  name: sample-nextjs
  services:
    - name: sample-nextjs
      environment_slug: node-js
      github:
        repo: Anxiietyx/sample-nextjs
        branch: main
        deploy_on_push: true
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      build_command: npm run build
      run_command: npm start
      http_port: 3000